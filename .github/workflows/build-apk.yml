name: Build Android Release
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Create Android project, icon and splash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npm run assets:generate
          npx cap sync android
      - name: Restore keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/riazi.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Configure release signing
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "signingConfigs.release" not in s:
              s, n = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", s, count=1)
              assert n == 1, "release buildType not found"
              block = (
                  "    signingConfigs {\n"
                  "        release {\n"
                  "            storeFile file('riazi.jks')\n"
                  "            storePassword System.getenv('KEYSTORE_PASSWORD')\n"
                  "            keyAlias System.getenv('KEY_ALIAS')\n"
                  "            keyPassword System.getenv('KEY_PASSWORD')\n"
                  "        }\n"
                  "    }\n"
              )
              s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
              open(p, "w", encoding="utf-8").write(s)
          PY
      - name: Build signed release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: riazi-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: riazi-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
